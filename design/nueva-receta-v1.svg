<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 1020" font-family="Roboto, sans-serif">
  <defs>
    <style>
      .bg { fill: #F6F5F1; }
      .surface { fill: #FFFFFF; }
      .border { stroke: #E5E2DC; stroke-width: 1; fill: none; }
      .border-fill { stroke: #E5E2DC; stroke-width: 1; fill: #FFFFFF; }
      .text-primary { fill: #2C2925; font-size: 13px; }
      .text-muted { fill: #9B9893; font-size: 11px; }
      .text-section { fill: #9B9893; font-size: 11px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
      .text-label { fill: #6B6660; font-size: 11px; }
      .text-placeholder { fill: #C4C0BA; font-size: 12px; }
      .text-title { fill: #2C2925; font-size: 16px; font-weight: 600; font-family: 'Noto Serif JP', serif; }
      .input-bg { fill: #FFFFFF; stroke: #E5E2DC; stroke-width: 1; rx: 6; }
      .input-bg-improved { fill: #FFFDF7; stroke: #F5A800; stroke-width: 1.5; rx: 6; stroke-dasharray: 4 2; }
      .select-bg { fill: #FFFDF7; stroke: #F5A800; stroke-width: 1.5; rx: 6; }
      .btn-primary { fill: #F5A800; rx: 6; }
      .btn-primary-text { fill: #FFFFFF; font-size: 13px; font-weight: 500; }
      .btn-outline { fill: none; stroke: #E5E2DC; stroke-width: 1; rx: 6; }
      .btn-outline-text { fill: #6B6660; font-size: 13px; }
      .badge-improved { fill: #FFF3CC; rx: 4; }
      .badge-improved-text { fill: #8A6800; font-size: 9px; font-weight: 600; }
      .badge-ok { fill: #E8F5E9; rx: 4; }
      .badge-ok-text { fill: #3D9A5C; font-size: 9px; font-weight: 600; }
      .separator { stroke: #E5E2DC; stroke-width: 1; }
      .icon-chevron { fill: none; stroke: #9B9893; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .icon-search { fill: none; stroke: #9B9893; stroke-width: 1.5; stroke-linecap: round; }
      .annotation { fill: #C8423A; font-size: 10px; font-style: italic; }
      .annotation-line { stroke: #C8423A; stroke-width: 1; stroke-dasharray: 3 2; }
      .card { fill: #FFFFFF; stroke: #E5E2DC; stroke-width: 1; rx: 12; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="540" height="1020" class="bg" rx="12"/>

  <!-- Dialog container -->
  <rect x="10" y="10" width="520" height="1000" class="card"/>

  <!-- ═══ Header ═══ -->
  <text x="30" y="42" class="text-title">Nueva receta</text>
  <line x1="10" y1="58" x2="530" y2="58" class="separator"/>

  <!-- ═══ SECCIÓN: Paciente ═══ -->
  <text x="30" y="82" class="text-section">PACIENTE</text>
  <line x1="105" y1="78" x2="510" y2="78" class="separator"/>

  <!-- Campo: Mascota (autocomplete — OK) -->
  <text x="30" y="102" class="text-label">Mascota *</text>
  <rect x="30" y="108" width="490" height="32" class="input-bg"/>
  <circle cx="48" cy="124" r="8" fill="none" stroke="#9B9893" stroke-width="1.5"/>
  <line x1="54" y1="129" x2="58" y2="133" class="icon-search"/>
  <text x="64" y="128" class="text-placeholder">Buscar mascota...</text>
  <rect x="445" y="110" width="32" height="28" fill="none"/>
  <text x="480" y="128" class="text-muted" text-anchor="middle">▾</text>
  <!-- Badge OK -->
  <rect x="445" y="100" width="24" height="14" class="badge-ok"/>
  <text x="457" y="110" class="badge-ok-text" text-anchor="middle">OK</text>

  <!-- Datos paciente: grid 3 cols -->
  <!-- Especie — MEJORAR: Select con enum de patients -->
  <text x="30" y="160" class="text-label">Especie</text>
  <rect x="30" y="166" width="155" height="32" class="select-bg"/>
  <text x="42" y="186" class="text-placeholder">Seleccionar...</text>
  <text x="168" y="186" class="text-muted">▾</text>
  <!-- Annotation -->
  <rect x="30" y="200" width="80" height="14" class="badge-improved"/>
  <text x="34" y="210" class="badge-improved-text">⚡ MEJORAR</text>
  <text x="115" y="210" class="annotation">Select con enum de patients plugin</text>

  <!-- Raza — OK texto libre -->
  <text x="195" y="160" class="text-label">Raza</text>
  <rect x="195" y="166" width="155" height="32" class="input-bg"/>
  <text x="207" y="186" class="text-placeholder">Ej: Labrador</text>
  <rect x="317" y="155" width="18" height="14" class="badge-ok"/>
  <text x="326" y="165" class="badge-ok-text" text-anchor="middle">OK</text>

  <!-- Peso — OK numérico -->
  <text x="365" y="160" class="text-label">Peso (kg)</text>
  <rect x="365" y="166" width="155" height="32" class="input-bg"/>
  <text x="377" y="186" class="text-placeholder">Kg</text>
  <rect x="488" y="155" width="18" height="14" class="badge-ok"/>
  <text x="497" y="165" class="badge-ok-text" text-anchor="middle">OK</text>

  <!-- ═══ SECCIÓN: Propietario ═══ -->
  <text x="30" y="242" class="text-section">PROPIETARIO</text>
  <rect x="135" y="232" width="32" height="14" class="badge-ok"/>
  <text x="151" y="242" class="badge-ok-text" text-anchor="middle">AUTO</text>
  <line x1="175" y1="238" x2="510" y2="238" class="separator"/>

  <!-- Nombre — input -->
  <text x="30" y="262" class="text-label">Nombre *</text>
  <rect x="30" y="268" width="240" height="32" class="input-bg"/>
  <text x="42" y="288" class="text-placeholder">Nombre del propietario</text>

  <!-- Teléfono -->
  <text x="280" y="262" class="text-label">Teléfono</text>
  <rect x="280" y="268" width="240" height="32" class="input-bg"/>
  <text x="292" y="288" class="text-placeholder">Tel. de contacto</text>

  <!-- Documento -->
  <text x="30" y="316" class="text-label">Documento</text>
  <rect x="30" y="322" width="240" height="32" class="input-bg"/>
  <text x="42" y="342" class="text-placeholder">DNI 12345678</text>

  <!-- Domicilio -->
  <text x="280" y="316" class="text-label">Domicilio</text>
  <rect x="280" y="322" width="240" height="32" class="input-bg"/>
  <text x="292" y="342" class="text-placeholder">Dirección</text>

  <!-- ═══ SECCIÓN: Veterinario ═══ -->
  <text x="30" y="384" class="text-section">VETERINARIO</text>
  <line x1="130" y1="380" x2="510" y2="380" class="separator"/>

  <!-- Nombre vet — MEJORAR: buscar en contactos -->
  <text x="30" y="404" class="text-label">Nombre *</text>
  <rect x="30" y="410" width="240" height="32" class="select-bg"/>
  <circle cx="48" cy="426" r="8" fill="none" stroke="#F5A800" stroke-width="1.5"/>
  <line x1="54" y1="431" x2="58" y2="435" stroke="#F5A800" stroke-width="1.5" stroke-linecap="round"/>
  <text x="64" y="430" class="text-placeholder">Buscar veterinario...</text>
  <rect x="30" y="444" width="80" height="14" class="badge-improved"/>
  <text x="34" y="454" class="badge-improved-text">⚡ MEJORAR</text>
  <text x="115" y="454" class="annotation">Autocomplete desde contacts + default vet</text>

  <!-- Matrícula -->
  <text x="280" y="404" class="text-label">Matrícula</text>
  <rect x="280" y="410" width="240" height="32" class="input-bg"/>
  <text x="292" y="430" class="text-placeholder">Nº de matrícula</text>
  <rect x="30" y="460" width="80" height="14" class="badge-improved"/>
  <text x="34" y="470" class="badge-improved-text">⚡ MEJORAR</text>
  <text x="115" y="470" class="annotation">Auto-fill matrícula al seleccionar vet</text>

  <!-- ═══ SECCIÓN: Diagnóstico ═══ -->
  <text x="30" y="500" class="text-section">DIAGNÓSTICO</text>
  <line x1="120" y1="496" x2="510" y2="496" class="separator"/>

  <!-- Consulta vinculada — OK -->
  <text x="30" y="520" class="text-label">Vincular a consulta (opcional)</text>
  <rect x="30" y="526" width="490" height="32" class="input-bg"/>
  <text x="42" y="546" class="text-muted">Sin consultas — seleccione mascota primero</text>

  <!-- Diagnóstico — MEJORAR: combobox con sugerencias -->
  <text x="30" y="576" class="text-label">Diagnóstico</text>
  <rect x="30" y="582" width="490" height="32" class="select-bg"/>
  <text x="42" y="602" class="text-placeholder">Escribir o seleccionar diagnóstico previo...</text>
  <text x="500" y="602" class="text-muted" text-anchor="end">▾</text>
  <rect x="30" y="616" width="80" height="14" class="badge-improved"/>
  <text x="34" y="626" class="badge-improved-text">⚡ MEJORAR</text>
  <text x="115" y="626" class="annotation">Combobox con diagnósticos previos del paciente</text>

  <!-- ═══ SECCIÓN: Medicamentos ═══ -->
  <text x="30" y="656" class="text-section">MEDICAMENTOS</text>
  <rect x="145" y="646" width="16" height="14" class="badge-ok"/>
  <text x="153" y="656" class="badge-ok-text" text-anchor="middle">1</text>
  <line x1="170" y1="652" x2="510" y2="652" class="separator"/>

  <!-- Card medicamento 1 -->
  <rect x="30" y="668" width="490" height="150" rx="8" stroke="#E5E2DC" stroke-width="1" fill="#FAFAF8"/>

  <!-- Medicamento autocomplete — OK -->
  <text x="42" y="688" class="text-label">Medicamento 1</text>
  <rect x="42" y="694" width="430" height="30" class="input-bg"/>
  <text x="54" y="713" class="text-placeholder">Buscar medicamento...</text>
  <!-- X button -->
  <rect x="480" y="694" width="28" height="30" fill="none" stroke="#E5E2DC" stroke-width="1" rx="4"/>
  <text x="494" y="713" fill="#C8423A" font-size="13" text-anchor="middle">✕</text>

  <!-- Fila 2: Dosis | Vía | Frecuencia | Duración | Cantidad -->
  <text x="42" y="744" class="text-label">Dosis</text>
  <rect x="42" y="750" width="80" height="28" class="input-bg"/>
  <text x="50" y="768" class="text-placeholder" font-size="10">5mg/kg</text>

  <text x="130" y="744" class="text-label">Vía</text>
  <rect x="130" y="750" width="80" height="28" class="input-bg"/>
  <text x="138" y="768" class="text-placeholder" font-size="10">—</text>
  <text x="198" y="768" class="text-muted" font-size="10">▾</text>

  <!-- Frecuencia — MEJORAR -->
  <text x="218" y="744" class="text-label">Frecuencia</text>
  <rect x="218" y="750" width="90" height="28" class="select-bg"/>
  <text x="226" y="768" class="text-placeholder" font-size="10">c/8h</text>
  <text x="296" y="768" fill="#F5A800" font-size="10">▾</text>

  <!-- Duración — MEJORAR -->
  <text x="316" y="744" class="text-label">Duración</text>
  <rect x="316" y="750" width="90" height="28" class="select-bg"/>
  <text x="324" y="768" class="text-placeholder" font-size="10">7 días</text>
  <text x="394" y="768" fill="#F5A800" font-size="10">▾</text>

  <text x="414" y="744" class="text-label">Cantidad</text>
  <rect x="414" y="750" width="60" height="28" class="input-bg"/>
  <text x="422" y="768" class="text-placeholder" font-size="10">1</text>

  <!-- Annotations para frecuencia y duración -->
  <rect x="218" y="782" width="80" height="14" class="badge-improved"/>
  <text x="222" y="792" class="badge-improved-text">⚡ MEJORAR</text>
  <text x="302" y="792" class="annotation">Combobox presets</text>

  <rect x="316" y="796" width="80" height="14" class="badge-improved"/>
  <text x="320" y="806" class="badge-improved-text">⚡ MEJORAR</text>
  <text x="400" y="806" class="annotation">Combobox presets</text>

  <!-- Botón agregar medicamento -->
  <rect x="30" y="824" width="490" height="32" rx="6" fill="none" stroke="#E5E2DC" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="270" y="844" text-anchor="middle" class="text-muted">+ Agregar medicamento</text>

  <!-- ═══ SECCIÓN: Observaciones ═══ -->
  <text x="30" y="882" class="text-section">OBSERVACIONES</text>
  <line x1="140" y1="878" x2="510" y2="878" class="separator"/>

  <rect x="30" y="890" width="490" height="56" class="input-bg"/>
  <text x="42" y="910" class="text-placeholder">Indicaciones adicionales, advertencias...</text>

  <!-- ═══ Footer: Acciones ═══ -->
  <line x1="10" y1="960" x2="530" y2="960" class="separator"/>
  <rect x="30" y="972" width="130" height="34" class="btn-primary" rx="6"/>
  <text x="95" y="993" text-anchor="middle" class="btn-primary-text">Guardar receta</text>
  <rect x="170" y="972" width="90" height="34" class="btn-outline" rx="6"/>
  <text x="215" y="993" text-anchor="middle" class="btn-outline-text">Cancelar</text>

  <!-- ═══ Leyenda ═══ -->
  <rect x="310" y="968" width="210" height="38" rx="6" fill="#FAFAF8" stroke="#E5E2DC" stroke-width="0.5"/>
  <rect x="320" y="975" width="10" height="10" fill="#FFFDF7" stroke="#F5A800" stroke-width="1.5" rx="2" stroke-dasharray="3 1"/>
  <text x="335" y="984" class="annotation" font-size="9" fill="#8A6800">Campo a mejorar (6 campos)</text>
  <rect x="320" y="990" width="10" height="10" fill="#FFFFFF" stroke="#E5E2DC" stroke-width="1" rx="2"/>
  <text x="335" y="999" font-size="9" fill="#3D9A5C">Campo OK (sin cambios)</text>
</svg>